[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openwavemix"
version = "0.1.0a1"
description = "Windows-first open audio mixer: device discovery and input metering foundation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Davorin Miličević"}]
dependencies = ["numpy>=2.0,<3", "sounddevice>=0.5.1,<0.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]
packaging = ["pyinstaller>=6.12,<7"]

[project.scripts]
openwavemix = "openwavemix.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openwavemix = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["hardware: requires explicitly selected real audio hardware"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "sounddevice"
ignore_missing_imports = true
